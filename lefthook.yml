# https://lefthook.dev/configuration/
rc: .lefthookrc

pre-commit:
  jobs:
    # マージコンフリクトのマーカーが残っていないか
    - name: check-merge-conflict
      run: |
        ! grep -EInH '^(<{7} |>{7} |\|{7} |={7}$)' {staged_files}

    # 秘密鍵が含まれていないか
    - name: detect-private-key
      exclude:
        - lefthook.yml
      run: |
        ! grep -EIlH 'BEGIN .*PRIVATE KEY' {staged_files}

    - name: ruff-check
      glob: "*.py"
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true

    - name: ruff-format
      glob: "*.py"
      run: uv run ruff format {staged_files}
      stage_fixed: true

# コミットメッセージが Conventional Commits 形式か (CONTRIBUTING.md 参照)
commit-msg:
  jobs:
    - name: check-commit-message
      run: |
        head -1 {1} | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+|^(Merge|Revert|fixup!|squash!) ' ||
          { echo "Conventional Commits 形式で書いてください (例: feat: add weekly menu command)"; exit 1; }

# push 前にテストを実行
pre-push:
  jobs:
    - name: test
      run: uv run pytest

# uv.lock の変更を環境に反映 (merge 後・ブランチ切替後)
post-merge:
  jobs:
    - name: uv-sync
      run: uv sync

post-checkout:
  jobs:
    - name: uv-sync
      # ブランチ切替時のみ ({3} が 1)。ファイル単位の checkout では実行しない
      run: |
        if [ "{3}" = "1" ]; then uv sync; fi
